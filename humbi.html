<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Humberto — M x H Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="member-page">

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <a href="index.html" class="studio-title">M x H Studio</a>
  </header>

  <main class="member-container">
    
    <!-- ENCABEZADO CON CÍRCULO ROJO Y NOMBRE -->
    <section class="member-header">
      <div class="profile-circle">
      
        <img src="img/humb.jpeg" alt="Mario Humberto" class="profile-img">
      </div>
      <div class="member-name">
        <h1>Mario<br><span>Humberto</span></h1>
      </div>
    </section>

    
    <section class="behance-box">
      
      <div class="behance-placeholder">
        <p><iframe src="https://www.behance.net/embed/project/255560765?ilo0=1" height="1000" width="1000" allowfullscreen lazyload frameborder="0" allow="clipboard-write" refererPolicy="strict-origin-when-cross-origin"></iframe></p>
       
      </div>
    </section>

    <!-- NUEVO RECTÁNGULO PARA VIDEO -->
    <section class="behance-box video-box">
      <video controls poster="img/logo.png">
        <source src="video/video humbi.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
      </video>
    </section>
    
    <!-- CAJA DE TEXTO OSCURA (DESCRIPCIÓN) -->
    <section class="bio-banner">
      <p>Diseñador multimedia con enfoque en animación 2D, postproducción y narrativa visual. Mi trabajo combina precisión técnica, ritmo y creatividad aplicada al movimiento digital.</p>
    </section>

    

    <!-- PIE CON ÍCONOS Y LOGO -->
    <footer class="member-footer">
      <div class="social-circles">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>
        <a href="#" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
      </div>
      <div class="footer-brand">
        <a href="index.html"><img src="img/mhstudio logo blanco.png" alt="M x H Studio Logo"></a>
      </div>
    </footer>

  </main>

</body>
</html>
