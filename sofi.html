<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melissa Sofia — M x H Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="member-page">

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <a href="index.html" class="studio-title">M x H Studio</a>
  </header>

  <main class="member-container">
    
    <!-- ENCABEZADO CON CÍRCULO ROJO Y NOMBRE -->
    <section class="member-header">
      <div class="profile-circle">
        <!-- Reemplaza el src con la foto de perfil cuando la tengas -->
        <img src="img/sof.jpeg" alt="Melissa Sofia" class="profile-img">
      </div>
      <div class="member-name">
        <h1>Melissa<br><span>Sofia</span></h1>
      </div>
    </section>

    <!-- RECTÁNGULO GRIS:  -->
    <section class="behance-box">
      <!-- 📌 PEGA AQUÍ EL CÓDIGO EMBED DE BEHANCE DE SOFI (<IFRAME>) -->
      <div class="behance-placeholder">
        <p><iframe src="https://www.behance.net/embed/project/238851841?ilo0=1" height="316" width="404" allowfullscreen lazyload frameborder="0" allow="clipboard-write" refererPolicy="strict-origin-when-cross-origin"></iframe></p>
         </div>
    </section>
     <!-- NUEVO RECTÁNGULO PARA VIDEO -->
    <section class="behance-box video-box">
      <video controls poster="img/logo.png">
        <source src="video/te dejo ir_pfms.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
      </video>
    </section>

    <!-- CAJA DE TEXTO OSCURA (DESCRIPCIÓN) -->
    <section class="bio-banner">
      <p>Diseñadora multimedia enfocada en la escena musical y eventos en vivo. Especialista en capturar la esencia del momento a través de imagen, ritmo y narrativa digital.</p>
    </section>

    <!-- PIE CON ÍCONOS Y LOGO -->
    <footer class="member-footer">
      <div class="social-circles">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>
        <a href="#" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
      </div>
      <div class="footer-brand">
        <a href="index.html"><img src="img/mhstudio logo blanco.png" alt="M x H Studio Logo"></a>
      </div>
    </footer>

  </main>

</body>
</html>
